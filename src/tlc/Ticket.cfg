\* TLC config for the CORRECT ticket system at N = 3: mutual exclusion + the `valid` invariant hold on
\* every reachable state, and every hungry process eventually eats under weak-fair scheduling.
\*   tlc Ticket.tla            (Ticket.cfg is picked up by default)
SPECIFICATION Spec

CONSTANTS
  P = {p1, p2, p3}

CONSTRAINT
  TicketBound

INVARIANTS
  TypeOK
  MutualExclusion
  Valid

PROPERTIES
  Liveness
