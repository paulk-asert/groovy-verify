\*
\* The CYCLIC network -- the student mistake: both processes read before writing. TLC is EXPECTED to
\* report a deadlock in the initial state (neither receive is enabled, and nothing else can run), which
\* is the rung-2 counterpart of the compile-time "Process-network deadlock: circular wait" refutation.
\*   tlc -config NetworkCycle.cfg Network.tla      → "Deadlock reached" (the point)
SPECIFICATION Spec

CONSTANTS
  Cap = 1
  Primed = FALSE

INVARIANTS
  TypeOK
  Bounds

PROPERTIES
  Progress
