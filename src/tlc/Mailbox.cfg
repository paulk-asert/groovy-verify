\*
\* The REPAIR, with TWO concurrent senders: the gate is fed before any send, so no sender ever waits on a
\* handler that is itself waiting. Bounds holds however the two siblings interleave, and both finish.
\*   tlc Mailbox.tla            (Mailbox.cfg is picked up by default)
SPECIFICATION Spec

CONSTANTS
  Senders = {"s1", "s2"}
  Burst = 2
  Cap = 1
  Feeds = 4
  FeedFirst = TRUE

INVARIANTS
  TypeOK
  Bounds

PROPERTIES
  Progress
