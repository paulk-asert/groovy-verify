\*
\* The KNOT -- one sender, the burst first and the gate fed only afterwards. TLC is EXPECTED to report a
\* deadlock: the box is full, the handler is blocked on an empty gate, and the feed that would release it
\* is unreachable because it comes after the send that is stuck.
\*   tlc -config MailboxKnot.cfg Mailbox.tla      → "Deadlock reached" (the point)
SPECIFICATION Spec

CONSTANTS
  Senders = {"s1"}
  Burst = 3
  Cap = 1
  Feeds = 3
  FeedFirst = FALSE

INVARIANTS
  TypeOK
  Bounds

PROPERTIES
  Progress
