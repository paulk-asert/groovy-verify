\* TLC config for the BROKEN-DISPENSER variant: RequestBad hands out the same ticket twice, so two
\* processes can both reach the critical section. TLC reports MutualExclusion (and Valid's uniqueness
\* conjunct) VIOLATED and prints the shortest interleaved trace with two processes Eating at once -- the
\* same refutation groovy-verify gives when the uniqueness conjunct is dropped (Phase 170), here played
\* out step by step.
\*   tlc Ticket.tla -config TicketBad.cfg
SPECIFICATION BuggySpec

CONSTANTS
  P = {p1, p2, p3}

CONSTRAINT
  TicketBound

\* We check MutualExclusion (the safety property itself) so TLC exhibits the two-processes-Eating trace.
\* The internal `valid` invariant also fails here — trivially and earlier, since a duplicate ticket breaks
\* `t[p] < ticket` at the first bad request — so it is omitted to keep the counterexample on the real property.
INVARIANTS
  TypeOK
  MutualExclusion
