// SMT-backed verification extension for Groovy, packaged as a standalone
// library. Consumers reference the type-checking extension by FQN:
//
//   @TypeChecked(extensions = 'verification.VerifyChecker')
//
// and only need this artifact on their compile classpath. The Z3 solver
// (via the z3-turnkey distribution, which bundles native libs for the
// major platforms) runs at the consumer's compile time.
//
// Not on Maven Central yet, but consumable three ways without it (see README):
//   - composite build:  includeBuild('../groovy-verify')   (the groovy6-functional repo)
//   - local install:    ./gradlew publishToMavenLocal      (io.github.paulk-asert:groovy-verify:…)
//   - JitPack:          built from a GitHub tag/commit on demand

plugins {
    id 'com.github.ben-manes.versions' version '0.54.0'
    id 'org.nosphere.apache.rat' version '0.8.1'
    id 'groovy'
    id 'java-library'
    id 'maven-publish'
    // Maven Central publishing (signs + uploads to the Central Portal). Inert until its own tasks
    // (`jreleaserDeploy` / `jreleaserConfig`) are invoked — does not touch build / verify / check.
    id 'org.jreleaser' version '1.24.0'
    // Fray controlled-schedule concurrency testing (rung 3 for the lock-ordering / deadlock half). Pointed at
    // the isolated `frayCheck` task below, so it never touches the main `test` execution. Run: ./gradlew frayCheck
    id 'org.pastalab.fray.gradle' version '0.8.5'
}

// Group + name are what Gradle matches for includeBuild dependency substitution, so the companion
// blog repo (groovy6-functional) must declare the dependency under THIS coordinate. `io.github.paulk-asert`
// is the Maven Central namespace, verified via GitHub (a one-off verification repo under the paulk-asert
// account) rather than DNS. The version is a placeholder until the first release.
group = 'io.github.paulk-asert'
version = '0.1.0-SNAPSHOT'

// Apache RAT: don't license-check generated output, IDE metadata, or the wrapper.
tasks.named('rat') {
    excludes = ['**/build/**', '**/.idea/**', 'gradle/**', '**/.gradle/**']
}

// Everything this project needs from Groovy 6.0.0-SNAPSHOT is on the ASF snapshot repo:
// static @Ensures, method-level @Decreases (GROOVY-12060), nested closures in contract
// conditions including @Ensures (GROOVY-12059 — enables the `any` / membership existential
// surface), the native primitive `int[]` GDK `isSorted()` overload the sortedness idiom
// leans on (so no `verification.SortedExtensions` backfill), restored generic types in
// @Ensures closures (GROOVY-12071 — so tuple slots / map values / generic-list elements need
// no `(int)` cast in contracts), and imports reaching loop-level @Invariant/@Decreases closures
// (GROOVY-12072 — so helper references inside them need no `verification.` FQN). So the build is
// self-contained: no hand-built Groovy in mavenLocal. (A Groovy core dev testing a *local* patch can
// add mavenLocal() above; if a freshly-published snapshot looks stale, `--refresh-dependencies`.)
repositories {
    mavenCentral()
    maven { url = 'https://repository.apache.org/content/repositories/snapshots' }
}

def groovyVersion = '6.0.0-SNAPSHOT'
def spockVersion  = '2.4-groovy-5.0'

dependencies {
    // Z3 with bundled native libs (linux/mac/windows, amd64+aarch64).
    // Exposed via `api` so it lands on the consumer's COMPILE classpath:
    // the type-checking extension runs Z3 while the consumer compiles.
    api 'tools.aqua:z3-turnkey:4.14.1'

    // The consumer brings its own Groovy + groovy-contracts; we only need
    // them to compile against (and at test time, to exercise the checker).
    compileOnly "org.apache.groovy:groovy:$groovyVersion"
    compileOnly "org.apache.groovy:groovy-contracts:$groovyVersion"

    testImplementation "org.apache.groovy:groovy:$groovyVersion"
    testImplementation "org.apache.groovy:groovy-json:$groovyVersion"   // Harvester (agent catalog/corpus generation)
    testImplementation "org.apache.groovy:groovy-contracts:$groovyVersion"

    // Test-only: Jakarta Bean Validation constraint annotations (@Positive, @Min, @Size, …). The engine reads
    // them as preconditions but matches by fully-qualified name — it never compiles or runs against this jar —
    // so it stays out of the published POM (test scope is not transitive). Here only so snippet sources that
    // carry these annotations resolve at on-the-fly compile time.
    testImplementation 'jakarta.validation:jakarta.validation-api:3.1.1'

    // Test-only: the JSR 385 Units of Measurement API (javax.measure.Quantity and the
    // javax.measure.quantity.* kind interfaces). The engine reads a Quantity's dimension off the generic
    // type and matches by fully-qualified name — it never compiles or runs against this jar — so it stays
    // out of the published POM. Here only so snippet sources that carry these types resolve at compile time.
    testImplementation 'javax.measure:unit-api:2.2'
    // The JSR 385 reference implementation (Indriya) — brings `Quantities.getQuantity`, `Units.*` and
    // `MetricPrefix.*` so the C₁ value/scale snippets resolve. Test-only, like unit-api; the engine reads
    // these by FQN / simple name and never compiles against the jar.
    testImplementation 'tech.units:indriya:2.2.4'
    // US-customary units (USCustomary.MILE, …) for the metric-vs-imperial scale examples. Test-only; the engine
    // reads MILE's scale from its own curated table, and UnitScaleTest pins that table against this library.
    testImplementation 'systems.uom:systems-common:2.2'

    // The sibling @TypeChecked extensions (NullChecker / RegexChecker / FormatStringChecker /
    // PurityChecker / ModifiesChecker). Test-only: a consumer supplies these themselves when they
    // combine checkers — groovy-verify neither compiles nor runs against them — so they never reach
    // the published POM (test scope is not transitive). Here, to exercise multi-extension composition.
    testImplementation "org.apache.groovy:groovy-typecheckers:$groovyVersion"

    // Test-only: the `DO(x in m, …) { … }` monadic-comprehension macro, so a test can exercise MonadicChecker
    // (which checks comprehension *use* sites) on a hand-rolled @Monadic carrier — not just define+verify it.
    testImplementation "org.apache.groovy:groovy-macro-library:$groovyVersion"

    // JUnit 6 — drives the VerifyHarness `@TestFactory` (one dynamic test per CASES entry), so the
    // suite is individually runnable from the IDE / `./gradlew test`. The compact `CASES` data and the
    // `./gradlew verify` console runner (VerifyHarness.main) are unchanged; both share `evaluate()`.
    testImplementation platform('org.junit:junit-bom:6.1.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(GroovyCompile).configureEach {
    groovyOptions.parameters = true   // keep formal parameter names for the checker
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()   // Maven Central requires a javadoc jar; empty for this pure-Groovy project, which satisfies it
}

// Get a consumable artifact without a Maven Central release:
//   ./gradlew publishToMavenLocal   ->  io.github.paulk-asert:groovy-verify:0.1.0-SNAPSHOT in ~/.m2
// any local Gradle/Maven project can then depend on it. This is also what JitPack
// runs to build the jar from a GitHub tag/commit on demand (the build is self-contained).
//
// For a Maven Central release (after Groovy 6 ships): `publish` stages the artifacts into
// build/staging-deploy and `jreleaserDeploy` signs + uploads them to the Central Portal. The full
// POM metadata below is what Central validation requires. `compileOnly` deps (Groovy, groovy-contracts)
// are not transitive, so they never appear in the published POM — only the `api` dep (z3-turnkey) does.
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'groovy-verify'
                description = 'SMT-backed @TypeChecked extension that proves groovy.contracts annotations at compile time'
                url = 'https://github.com/paulk-asert/groovy-verify'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'paulk'
                        name = 'Paul King'
                        email = 'paulk@asert.com.au'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/paulk-asert/groovy-verify.git'
                    developerConnection = 'scm:git:git@github.com:paulk-asert/groovy-verify.git'
                    url = 'https://github.com/paulk-asert/groovy-verify'
                }
            }
        }
    }
    repositories {
        // Local staging dir for JReleaser to consume on release. Additive — `publishToMavenLocal`
        // (and therefore JitPack) keep working unchanged.
        maven {
            name = 'staging'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

// Maven Central publishing via JReleaser — runs ONLY on its own tasks (`jreleaserDeploy` /
// `jreleaserConfig`); inert during build / verify / check. Credentials come from env vars (never the
// repo): JRELEASER_MAVENCENTRAL_USERNAME / _PASSWORD and JRELEASER_GPG_PASSPHRASE / _PUBLIC_KEY /
// _SECRET_KEY — confirm exact names with `./gradlew jreleaserConfig`. Release day only: bump
// `groovyVersion` to the released Groovy and `version` to a non-SNAPSHOT before deploying.
jreleaser {
    project {
        description = 'SMT-backed @TypeChecked verification extension for groovy.contracts'
        authors = ['Paul King']
        license = 'Apache-2.0'
        copyright = 'Paul King'
        links {
            homepage = 'https://github.com/paulk-asert/groovy-verify'
        }
    }
    signing {
        active = 'ALWAYS'
        armored = true
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository('build/staging-deploy')
                    applyMavenCentralRules = true   // pre-validates pom / sources / javadoc / signatures
                }
            }
        }
    }
}

// Self-test: compiles a battery of good/bad annotated snippets on the fly
// and asserts the checker's diagnostics. Run with `./gradlew verify`.
def verifyTask = tasks.register('verify', JavaExec) {
    group = 'verification'
    description = 'Compile good/bad snippets and assert VerifyChecker diagnostics'
    dependsOn 'compileGroovy', 'compileTestGroovy'
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'VerifyHarness'
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']  // quiet the JDK25 native-access warning from z3
}

// Harvest the agent-facing capability corpus + catalog from VerifyHarness.CASES (the single source of truth).
//   ./gradlew harvest                          -> build/harvest/{catalog.json, corpus.jsonl}
//   ./gradlew harvest --args='agents -check'   -> CI freshness gate: fail if committed copies are stale
tasks.register('harvest', JavaExec) {
    group = 'verification'
    description = 'Generate the AI-agent capability catalog + example corpus from the test suite'
    dependsOn 'compileTestGroovy'
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'Harvester'
}

// Report-mode drift lints (group descriptions / doc snippets-as-tests / architecture file map). Run on demand;
// convert each to a JUnit assert to enforce in `check` once the existing gap is baselined.  ./gradlew docLint
tasks.register('docLint', JavaExec) {
    group = 'verification'
    description = 'Report doc/data drift against the test suite (sketch — report-only)'
    dependsOn 'compileTestGroovy'
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'DocLint'
}

// Runtime rung (Slice 1): differential soundness oracle — recompile each ok:true case verifier-off with
// groovy-contracts live, run it over an input grid, and fail if a proved contract is refuted at runtime.
//   ./gradlew runtimeRung
tasks.register('runtimeRung', JavaExec) {
    group = 'verification'
    description = 'Cross-validate every proved contract against runtime execution of the same annotation'
    dependsOn 'compileGroovy', 'compileTestGroovy'
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'RuntimeRung'
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.register('explainProbe', JavaExec) {
    group = 'verification'
    description = 'Prototype: explain a positive verification via Z3 unsat cores (which contract clauses the proof used)'
    dependsOn 'compileGroovy', 'compileTestGroovy'
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'ExplainProbe'
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.register('caseAxiomTiming', JavaExec) {
    group = 'verification'
    description = 'Standalone Z3 timing probe for the toUpper/toLower axiom set'
    dependsOn 'compileGroovy', 'compileTestGroovy'
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'CaseAxiomTiming'
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

// JUnit 6 dynamic-test view of the same suite (VerifyHarness.@TestFactory): one named test per CASES
// entry, individually runnable from the IDE / CLI. `check` uses this; `verify` (above) is the compact
// console runner. Run one case: `./gradlew test -Dverify.only='matrix sum'`.
tasks.named('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '2g'
    jvmArgs '--enable-native-access=ALL-UNNAMED'   // quiet the JDK25 z3 native-access warning
    if (System.getProperty('verify.only')) {
        systemProperty 'verify.only', System.getProperty('verify.only')
    }
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('check') {
    dependsOn 'test'         // JUnit dynamic-test run of the suite (verify remains the console runner)
    dependsOn 'runtimeRung'  // the sequential differential-soundness oracle: every proved contract is cross-validated
                             // against runtime execution of the same annotation (fails on a new confirmed divergence)
}

// ---- Concurrency spike: Lincheck on a real SpscBuffer (rung 3 of CONCURRENCY.md) ----------------
// The checker (rung 1) proves the sequential VC; src/tlc/Buffer.tla (rung 2) model-checks an abstract
// state machine; this rung model-checks the ACTUAL bytecode of a lock-free buffer across interleavings,
// discharging the atomicity/ordering assumption the other two leave open. Isolated in its own source
// set + task (NOT wired into `check` — run explicitly: ./gradlew lincheckTest). Runs on the same JDK 25 as the
// main build now that Lincheck 3.x (org.jetbrains.lincheck:lincheck) instruments via ASM 9.9 — the older 2.x line
// (org.jetbrains.kotlinx:lincheck) bundled a byte-buddy that couldn't transform JDK 25 class files and silently
// missed bugs, which is why this was pinned to Java 21 before.
// Two source sets, split by role (assessed 2026-06): `concurrent` holds the DOMAIN classes under test — the buffers,
// the §VII Buffer, the bank Account — which the verifier (rung 1, by file) and these runtime checkers (rung 3) both
// consume. `lincheck` holds the Lincheck operation-holder TESTS. The split scopes each compile knob to exactly where
// it belongs (the contracts-disable to the domain, `parameters=false` to the @Operation holders), and lets the Fray
// test share the same domain Account instead of duplicating it.
sourceSets {
    concurrent {
        groovy.srcDir 'src/concurrent/groovy'
    }
    lincheck {
        groovy.srcDir 'src/lincheck/groovy'
    }
}

// The lincheck tests instantiate the compiled domain classes, so they need everything the domain needs (the engine
// for the §VII Buffer's verification.* annotations, groovy-contracts for the buffers' @Invariant) plus the domain's
// own compiled output.
configurations {
    lincheckImplementation.extendsFrom concurrentImplementation
}

dependencies {
    // ---- concurrent = the DOMAIN under test (@CompileStatic Groovy -> clean, dispatch-free bytecode) ----
    concurrentImplementation "org.apache.groovy:groovy:$groovyVersion"
    // The engine, so the §VII `Buffer`'s verification.* annotations (@Rely/@Guarantee/@UnderRely/@Label, Declassify)
    // RESOLVE here too — the same source groovy-verify proves (BufferVerifyTest). They're plain annotations with no
    // AST transform (Declassify.to is an identity), so they inject nothing; like the contracts, they're inert at the
    // Lincheck boundary.
    concurrentImplementation project(':')
    // groovy-contracts only so SpscBuffer / Buffer's @Invariant/@Requires *resolve* — the same source groovy-verify
    // proves (SpscBufferVerifyTest). Their injected runtime assertions are disabled at the compile knob below, so the
    // bytecode is bare; the annotations only need to be on the classpath.
    concurrentImplementation "org.apache.groovy:groovy-contracts:$groovyVersion"

    // ---- lincheck = the Lincheck TESTS (depend on the compiled domain + the domain's deps via extendsFrom) ----
    lincheckImplementation sourceSets.concurrent.output
    lincheckImplementation 'org.jetbrains.lincheck:lincheck:3.6'
    lincheckImplementation platform('org.junit:junit-bom:6.1.0')
    lincheckImplementation 'org.junit.jupiter:junit-jupiter'
    lincheckRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def jdk25Compiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
def jdk25Launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }

// The Lincheck operation holders read @Operation parameter names for generators: with the project-wide
// `parameters = true` present, Lincheck reads `offer(int x)` as a reference to a *named* generator "x" and fails.
// Off -> it uses a default type-based generator, as the Java version did. (This knob belongs to the TEST holders,
// hence on the lincheck compile, not the domain.)
tasks.named('compileLincheckJava') { javaCompiler = jdk25Compiler }     // no Java sources, but keep pinned
tasks.named('compileLincheckGroovy') {
    javaLauncher = jdk25Launcher
    groovyOptions.parameters = false
}

tasks.named('compileConcurrentJava') { javaCompiler = jdk25Compiler }   // no Java sources now, but keep pinned
tasks.named('compileConcurrentGroovy') {
    javaLauncher = jdk25Launcher
    // THE compile knob. SpscBuffer / Buffer carry the SAME @Invariant/@Requires that groovy-verify proves
    // (SpscBufferVerifyTest) — but here we DISABLE groovy-contracts' global AST transforms so nothing is injected:
    // the annotations stay resolvable (the jar is on the classpath) yet inert, leaving bare lock-free bytecode for
    // Lincheck.
    //
    // Why disable the *transforms* rather than just assertions, on Lincheck 3.6 (measured 2026-06):
    //   - The old reason — Lincheck 2.39's SnapshotTracker.restoreValues threw ConcurrentModificationException over
    //     groovy-contracts' static state — is GONE: 3.6 no longer trips the CME (we re-enabled transforms and
    //     confirmed). That upstream bug is effectively fixed for us.
    //   - The real reason now: with transforms ON, a contract-checked method is NOT bare bytecode. groovy-contracts
    //     renders each assertion through Groovy power-assert (org.codehaus.groovy.runtime.powerassert.ValueRecorder),
    //     shared static trackers (ViolationTracker.INSTANCE, ContractExecutionTracker), and a per-call $_gc_closure
    //     allocation, plus generated precondition/$rely$ methods. Lincheck faithfully *explores* all of it, so the
    //     managed run hangs / reports invalid results — concurrency surface that has nothing to do with the algorithm.
    //   - 3.6 *does* expose a surgical alternative: opts().addGuarantee(forClasses(...).ignore()/.treatAsAtomic())
    //     tells the managed strategy not to look inside named classes. It works for the simple bounds buffer
    //     (SpscBuffer passes with contracts live), but fully covering the richer Buffer means guarantee-excluding an
    //     open-ended, version-specific set of groovy-contracts/power-assert internals — whack-a-mole, and it still
    //     hung on Buffer. Disabling the transforms gives genuinely bare bytecode in one move (the whole @POJO point),
    //     so we keep it.
    //   - And -da does NOT help: groovy-contracts 6.0.0-alpha-1 emits its invariant_*/precondition checks as plain
    //     unconditional method calls, not `-ea`-guarded `assert` bytecode, so enableAssertions=false skips nothing
    //     (measured: transforms ON + -da still hangs, ViolationTracker/ValueRecorder/$_gc_closure all execute).
    groovyOptions.disabledGlobalASTTransformations = [
        'org.apache.groovy.contracts.ast.GContractsASTTransformation',
        'org.apache.groovy.contracts.ast.ClosureExpressionEvaluationASTTransformation',
        'org.apache.groovy.contracts.ast.MethodVariantInheritanceASTTransformation',
    ] as Set
}

tasks.register('lincheckTest', Test) {
    group = 'verification'
    description = 'Lincheck linearizability tests over the concurrent domain classes (rung 3 of CONCURRENCY.md)'
    testClassesDirs = sourceSets.lincheck.output.classesDirs
    classpath = sourceSets.lincheck.runtimeClasspath
    useJUnitPlatform()
    javaLauncher = jdk25Launcher
    // Lincheck's managed strategy instruments bytecode and reaches into java.base internals.
    jvmArgs = [
        '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-exports', 'java.base/jdk.internal.util=ALL-UNNAMED',
        '--add-exports', 'java.base/sun.security.action=ALL-UNNAMED',
    ]
    testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
}

// ---- TLA+ model check: TLC on src/tlc/Buffer.tla (rung 2 of CONCURRENCY.md) ------------------------
// Model-checks the §VII buffer across EVERY interleaving (the rely becomes a checked theorem about the
// peer; liveness too) — the exhaustive-model rung the compile-time checker leaves open. tla2tools isn't
// on Maven Central, so resolve the pinned release jar from GitHub releases via an Ivy repo, scoped to
// just that one artifact (Gradle caches it; no download script). NOT wired into `check` — run with:
//   ./gradlew tlcCheck                 (secure spec: expects "No error has been found")
// The leak variant is a one-liner demo (TLC exits non-zero on the violation it is meant to find):
//   java -cp <jar> tlc2.TLC -config BufferLeak.cfg src/tlc/Buffer.tla
repositories {
    ivy {
        name = 'tlaplus-github-releases'
        url = 'https://github.com/tlaplus/tlaplus/releases/download'
        patternLayout { artifact '[revision]/[module].[ext]' }
        metadataSources { artifact() }
        content { includeModule('tlaplus', 'tla2tools') }   // this repo serves ONLY tla2tools
    }
}

configurations { tlc }
dependencies { tlc 'tlaplus:tla2tools:v1.7.4@jar' }          // -> .../download/v1.7.4/tla2tools.jar (TLC 2.19)

// TLC writes scratch (states/, metadata) into its working dir, so run it in build/ — never the source
// tree. Sync the model + configs there first; `src/tlc/` stays clean.
def tlcWorkDir = layout.buildDirectory.dir('tlc').get().asFile

def tlcPrepare = tasks.register('tlcPrepare', Sync) {
    from('src/tlc') { include '*.tla', '*.cfg' }
    into tlcWorkDir
}

tasks.register('tlcCheck', JavaExec) {
    group = 'verification'
    description = 'Model-check src/tlc/Buffer.tla (secure spec) with TLA+ TLC — rung 2 of CONCURRENCY.md'
    dependsOn tlcPrepare
    classpath = configurations.tlc
    mainClass = 'tlc2.TLC'
    workingDir = tlcWorkDir
    args = ['-nowarning', 'Buffer.tla']         // Buffer.cfg is picked up by name; invariants + relies + Progress
    jvmArgs = ['-XX:+UseParallelGC']            // the GC TLC asks for
}

// ---- Fray: controlled-schedule deadlock detection (rung 3 for the lock-ordering half) ----------
// Complements the Lincheck spike: Lincheck checks linearizability (the race/atomicity half of the locks
// example); Fray drives the real JVM scheduler over a *hand-threaded* bank-transfer to check the OTHER
// disclaimed half — deadlock / lock-ordering. Fray runs on (and downloads) Corretto JDK 25, this project's
// own toolchain. Isolated in its own source set + task; the `fray { testTask = 'frayCheck' }` binding makes
// the plugin configure THIS task (agent + Fray JDK) rather than the main `test`. Run: ./gradlew frayCheck
sourceSets {
    frayCheck {
        groovy.srcDir 'src/fray/groovy'
    }
}

dependencies {
    frayCheckImplementation "org.apache.groovy:groovy:$groovyVersion"
    // The shared domain `Account` (plain @CompileStatic @POJO) — Fray uses its `id` for a global lock order instead
    // of redefining a bank account inline. Just the compiled output; Account pulls in nothing exotic.
    frayCheckImplementation sourceSets.concurrent.output
    frayCheckImplementation platform('org.junit:junit-bom:6.1.0')
    frayCheckImplementation 'org.junit.jupiter:junit-jupiter'
    frayCheckRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // fray-core / fray-junit / fray-runtime / fray-jvmti are injected into frayCheckImplementation by the plugin
}

tasks.register('frayCheck', Test) {
    group = 'verification'
    description = 'Fray controlled-schedule check that the ordered-locking bank transfer is deadlock-free'
    testClassesDirs = sourceSets.frayCheck.output.classesDirs
    classpath = sourceSets.frayCheck.runtimeClasspath
    useJUnitPlatform()                          // the plugin re-applies this with includeTags('FrayTest')
    // Fray seizes every JVM thread, so Groovy's PIC-Cleaner daemon (CacheableCallSite) — which parks
    // forever on a queue — reads as a false deadlock. `inline = true` cleans call sites inline instead of on
    // a background thread (the static initializer then skips Thread.start()), so the only threads Fray sees
    // are the application's. (The flag is in the Groovy 6.0.0-SNAPSHOT from the ASF snapshot repo.)
    systemProperty 'groovy.indy.callsite.cleaner.inline', 'true'
}

fray {
    testTask = 'frayCheck'                       // configure frayCheck (not the main `test`) with the Fray agent + JDK
}
