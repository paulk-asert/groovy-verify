// SMT-backed verification extension for Groovy, packaged as a standalone
// library. Consumers reference the type-checking extension by FQN:
//
//   @TypeChecked(extensions = 'verification.VerifyChecker')
//
// and only need this artifact on their compile classpath. The Z3 solver
// (via the z3-turnkey distribution, which bundles native libs for the
// major platforms) runs at the consumer's compile time.
//
// Not on Maven Central yet, but consumable three ways without it (see README):
//   - composite build:  includeBuild('../groovy-verify')   (the groovy6-functional repo)
//   - local install:    ./gradlew publishToMavenLocal      (io.github.paulk-asert:groovy-verify:…)
//   - JitPack:          built from a GitHub tag/commit on demand

plugins {
    id 'com.github.ben-manes.versions' version '0.54.0'
    id 'org.nosphere.apache.rat' version '0.8.1'
    id 'groovy'
    id 'java-library'
    id 'maven-publish'
    // Maven Central publishing (signs + uploads to the Central Portal). Inert until its own tasks
    // (`jreleaserDeploy` / `jreleaserConfig`) are invoked — does not touch build / verify / check.
    id 'org.jreleaser' version '1.24.0'
}

// Group + name are what Gradle matches for includeBuild dependency substitution, so the companion
// blog repo (groovy6-functional) must declare the dependency under THIS coordinate. `io.github.paulk-asert`
// is the Maven Central namespace, verified via GitHub (a one-off verification repo under the paulk-asert
// account) rather than DNS. The version is a placeholder until the first release.
group = 'io.github.paulk-asert'
version = '0.1.0-SNAPSHOT'

// Apache RAT: don't license-check generated output, IDE metadata, or the wrapper.
tasks.named('rat') {
    excludes = ['**/build/**', '**/.idea/**', 'gradle/**', '**/.gradle/**']
}

// Everything this project needs from Groovy 6.0.0-SNAPSHOT is on the ASF snapshot repo:
// static @Ensures, method-level @Decreases (GROOVY-12060), nested closures in contract
// conditions including @Ensures (GROOVY-12059 — enables the `any` / membership existential
// surface), the native primitive `int[]` GDK `isSorted()` overload the sortedness idiom
// leans on (so no `verification.SortedExtensions` backfill), restored generic types in
// @Ensures closures (GROOVY-12071 — so tuple slots / map values / generic-list elements need
// no `(int)` cast in contracts), and imports reaching loop-level @Invariant/@Decreases closures
// (GROOVY-12072 — so helper references inside them need no `verification.` FQN). So the build is
// self-contained: no hand-built Groovy in mavenLocal. (A Groovy core dev testing a *local* patch can
// add mavenLocal() above; if a freshly-published snapshot looks stale, `--refresh-dependencies`.)
repositories {
    mavenCentral()
    maven { url = 'https://repository.apache.org/content/repositories/snapshots' }
}

def groovyVersion = '6.0.0-SNAPSHOT'
def spockVersion  = '2.4-groovy-5.0'

dependencies {
    // Z3 with bundled native libs (linux/mac/windows, amd64+aarch64).
    // Exposed via `api` so it lands on the consumer's COMPILE classpath:
    // the type-checking extension runs Z3 while the consumer compiles.
    api 'tools.aqua:z3-turnkey:4.14.1'

    // The consumer brings its own Groovy + groovy-contracts; we only need
    // them to compile against (and at test time, to exercise the checker).
    compileOnly "org.apache.groovy:groovy:$groovyVersion"
    compileOnly "org.apache.groovy:groovy-contracts:$groovyVersion"

    testImplementation "org.apache.groovy:groovy:$groovyVersion"
    testImplementation "org.apache.groovy:groovy-contracts:$groovyVersion"

    // The sibling @TypeChecked extensions (NullChecker / RegexChecker / FormatStringChecker /
    // PurityChecker / ModifiesChecker). Test-only: a consumer supplies these themselves when they
    // combine checkers — groovy-verify neither compiles nor runs against them — so they never reach
    // the published POM (test scope is not transitive). Here, to exercise multi-extension composition.
    testImplementation "org.apache.groovy:groovy-typecheckers:$groovyVersion"

    // JUnit 5 — drives the VerifyHarness `@TestFactory` (one dynamic test per CASES entry), so the
    // suite is individually runnable from the IDE / `./gradlew test`. The compact `CASES` data and the
    // `./gradlew verify` console runner (VerifyHarness.main) are unchanged; both share `evaluate()`.
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(GroovyCompile).configureEach {
    groovyOptions.parameters = true   // keep formal parameter names for the checker
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()   // Maven Central requires a javadoc jar; empty for this pure-Groovy project, which satisfies it
}

// Get a consumable artifact without a Maven Central release:
//   ./gradlew publishToMavenLocal   ->  io.github.paulk-asert:groovy-verify:0.1.0-SNAPSHOT in ~/.m2
// any local Gradle/Maven project can then depend on it. This is also what JitPack
// runs to build the jar from a GitHub tag/commit on demand (the build is self-contained).
//
// For a Maven Central release (after Groovy 6 ships): `publish` stages the artifacts into
// build/staging-deploy and `jreleaserDeploy` signs + uploads them to the Central Portal. The full
// POM metadata below is what Central validation requires. `compileOnly` deps (Groovy, groovy-contracts)
// are not transitive, so they never appear in the published POM — only the `api` dep (z3-turnkey) does.
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'groovy-verify'
                description = 'SMT-backed @TypeChecked extension that proves groovy.contracts annotations at compile time'
                url = 'https://github.com/paulk-asert/groovy-verify'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'paulk'
                        name = 'Paul King'
                        email = 'paulk@asert.com.au'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/paulk-asert/groovy-verify.git'
                    developerConnection = 'scm:git:git@github.com:paulk-asert/groovy-verify.git'
                    url = 'https://github.com/paulk-asert/groovy-verify'
                }
            }
        }
    }
    repositories {
        // Local staging dir for JReleaser to consume on release. Additive — `publishToMavenLocal`
        // (and therefore JitPack) keep working unchanged.
        maven {
            name = 'staging'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

// Maven Central publishing via JReleaser — runs ONLY on its own tasks (`jreleaserDeploy` /
// `jreleaserConfig`); inert during build / verify / check. Credentials come from env vars (never the
// repo): JRELEASER_MAVENCENTRAL_USERNAME / _PASSWORD and JRELEASER_GPG_PASSPHRASE / _PUBLIC_KEY /
// _SECRET_KEY — confirm exact names with `./gradlew jreleaserConfig`. Release day only: bump
// `groovyVersion` to the released Groovy and `version` to a non-SNAPSHOT before deploying.
jreleaser {
    project {
        description = 'SMT-backed @TypeChecked verification extension for groovy.contracts'
        authors = ['Paul King']
        license = 'Apache-2.0'
        copyright = 'Paul King'
        links {
            homepage = 'https://github.com/paulk-asert/groovy-verify'
        }
    }
    signing {
        active = 'ALWAYS'
        armored = true
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository('build/staging-deploy')
                    applyMavenCentralRules = true   // pre-validates pom / sources / javadoc / signatures
                }
            }
        }
    }
}

// Self-test: compiles a battery of good/bad annotated snippets on the fly
// and asserts the checker's diagnostics. Run with `./gradlew verify`.
def verifyTask = tasks.register('verify', JavaExec) {
    group = 'verification'
    description = 'Compile good/bad snippets and assert VerifyChecker diagnostics'
    dependsOn 'compileGroovy', 'compileTestGroovy'
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'VerifyHarness'
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']  // quiet the JDK25 native-access warning from z3
}

tasks.register('caseAxiomTiming', JavaExec) {
    group = 'verification'
    description = 'Standalone Z3 timing probe for the toUpper/toLower axiom set'
    dependsOn 'compileGroovy', 'compileTestGroovy'
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'CaseAxiomTiming'
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

// JUnit 5 dynamic-test view of the same suite (VerifyHarness.@TestFactory): one named test per CASES
// entry, individually runnable from the IDE / CLI. `check` uses this; `verify` (above) is the compact
// console runner. Run one case: `./gradlew test -Dverify.only='matrix sum'`.
tasks.named('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '2g'
    jvmArgs '--enable-native-access=ALL-UNNAMED'   // quiet the JDK25 z3 native-access warning
    if (System.getProperty('verify.only')) {
        systemProperty 'verify.only', System.getProperty('verify.only')
    }
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('check') {
    dependsOn 'test'   // JUnit dynamic-test run of the suite (verify remains the console runner)
}
