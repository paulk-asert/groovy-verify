\*
\* TLC config for the LEAK variant: the producer skips Declassify, so advancing tail pulls a High
\* datum into the Low region. TLC reports RegionSound (and then NoLeak) VIOLATED and prints the
\* shortest interleaved trace that does it -- the same leak the checker refutes at `tail++`, here
\* exhibited step by step.
\*   tlc Buffer.tla -config BufferLeak.cfg
SPECIFICATION BuggySpec

CONSTANTS
  Cap = 3
  Data = {0, 1}

INVARIANTS
  TypeOK
  Bounds
  RegionSound
  NoLeak
