# Dependabot, in Apache Groovy's shape (weekly, 7-day cooldown, actions + gradle) — plus one entry
# Groovy doesn't need: ci/consumer-smoke is a STANDALONE Gradle build (its own settings.gradle, the
# JDK 17 floor smoke), so the root gradle entry never sees it and it gets its own.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "gradle"
    directory: "/ci/consumer-smoke"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
