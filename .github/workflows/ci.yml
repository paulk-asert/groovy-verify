# The verification mesh, enforced on every push/PR:
#   - `check`     — the 1400+-case proof suite (JUnit), the runtime differential-soundness oracle
#                   (RuntimeRung, with its coverage canary), and the doc-drift asserts (DocLintTest),
#                   plus the examples-dsl subproject's suite.
#   - `tlcCheck` / `tlcTicket` — the rung-2 exhaustive TLA+ models (the §VII buffer and the Leino
#                   ticket lock), model-checked with TLC.
#
# Deliberately NOT run here: the rung-3 real-bytecode tools (Lincheck, Fray, jcstress) — they are
# slow, scheduler-dependent, and Fray provisions its own JDK; run them locally per CONCURRENCY.md
# (`./gradlew lincheckTest frayCheck jcstressCheck`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Proof suite + runtime rung + doc lint
        run: ./gradlew check --no-daemon
        env:
          # Refute-direction VCs (model search) are hardware-speed sensitive; CI runners get 4x the
          # per-check solver budget a dev laptop needs for the same crisp refutations.
          VERIFY_Z3_TIMEOUT_MS: '8000'
      - name: TLC exhaustive models (rung 2)
        run: ./gradlew tlcCheck tlcTicket --no-daemon
